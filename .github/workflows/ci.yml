name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Some security setups skip the classic hooks without a word: a plugin that depended on one would stop working.
      - name: No classic hooks
        shell: pwsh
        run: |
          $hits = Select-String -Path hooks/*.ts, hooks/*.tsx -Pattern 'classic\.'
          if ($hits) {
            $hits | ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            exit 1
          }

      - name: The Windows script parses
        shell: pwsh
        run: |
          $errors = $null; $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/window.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { $_.Message }; exit 1 }

      # The real thing: windows are opened, placed, minimized and restored on the runner's desktop, and measured.
      - name: The Windows script on real windows
        shell: powershell
        run: ./tests/windows/window.test.ps1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # A command name Claude Code ships is only a warning, but the command is then never registered.
      - name: Validate
        shell: pwsh
        run: |
          $output = claude plugin validate . 2>&1 | Out-String
          $output
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($output -match 'is a name Claude Code ships') { Write-Error 'A command name is one Claude Code ships: rename it.'; exit 1 }

      - name: Test
        run: claude plugin test .

  # The scripts for macOS and Linux, against stand-ins for the system tools, on both systems.
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          command -v shellcheck > /dev/null || brew install shellcheck
          shellcheck scripts/*.sh tests/unix/*.sh

      - name: The scripts against stand-ins for the system tools
        run: bash tests/unix/scripts.test.sh

      - name: The AppleScript compiles
        if: runner.os == 'macOS'
        run: osacompile -o "$RUNNER_TEMP/window-macos.scpt" scripts/window-macos.applescript
